[package]
name = "agent-rider-store"
version = "0.1.1"
edition = "2021"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
hmac = "0.12"
http = "1"
mime_guess = "2"
pbkdf2 = "0.12"
portable-pty = "0.9"
rand = "0.9"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
urlencoding = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
