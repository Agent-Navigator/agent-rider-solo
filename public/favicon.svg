<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Agent Rider">
  <defs>
    <!-- Signature blue -> purple brand gradient -->
    <linearGradient id="ar-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79b9ff"/>
      <stop offset="0.55" stop-color="#6a86f5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Top-left sheen for a soft glossy badge -->
    <linearGradient id="ar-sheen" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Mint glow behind the spark -->
    <radialGradient id="ar-spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9ffe9"/>
      <stop offset="0.45" stop-color="#7ef0c4"/>
      <stop offset="1" stop-color="#7ef0c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#ar-bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#ar-sheen)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Ascending "rider" chevrons -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="12">
    <path d="M40 92 L64 68 L88 92" stroke="#ffffff" stroke-opacity="0.62"/>
    <path d="M40 70 L64 46 L88 70" stroke="#ffffff"/>
  </g>

  <!-- Agent spark leading the climb -->
  <circle cx="64" cy="35" r="16" fill="url(#ar-spark)"/>
  <circle cx="64" cy="35" r="7" fill="#7ef0c4"/>
</svg>
